name: CI

on:
  push:
    branches:
      - main

jobs:
  build_and_push_docker_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: latest

      - name: Verify Installation
        run: docker --version
